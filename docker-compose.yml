services:
  api-core:
    build:
      context: ./api-core/ApiCore/ApiCore
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${DB_NAME:-aichecker};Username=${DB_USER:-aichecker_user};Password=${DB_PASSWORD:-aichecker_password}
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=${JWT_SECRET:-super_secret_jwt_key_aichecker_enterprise_2026!}
      - JwtSettings__Issuer=${JWT_ISSUER:-ai-review-analyzer}
      - JwtSettings__Audience=${JWT_AUDIENCE:-ai-review-analyzer-frontend}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-1440}
      - AiDriver__Url=http://ai-driver:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saas-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OFFLINE_MODE: ${VITE_OFFLINE_MODE:-false}
    ports:
      - "80:80"
    depends_on:
      - api-core
    networks:
      - saas-network

  postgres:
    image: postgres:15-alpine
    container_name: aichecker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aichecker}
      POSTGRES_USER: ${DB_USER:-aichecker_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aichecker_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-aichecker_user} -d ${DB_NAME:-aichecker}" ]
      interval: 3s # Проверять каждые 3 секунды
      timeout: 3s # Таймаут на ответ
      retries: 10 # Сколько раз пытаться до того, как признать контейнер упавшим
    networks:
      - saas-network

  ai-driver:
    build:
      context: ./ai-driver
    ports:
      - "8000:8000"
    environment:
      # DeepSeek конфигурация
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      # SberGPT конфигурация
      - SBERGPT_API_KEY=${SBERGPT_API_KEY}
      - SBERGPT_BASE_URL=${SBERGPT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1/}
      - SBERGPT_MODEL=${SBERGPT_MODEL:-GigaChat-Pro}
      # Локальная Qwen модель (llama.cpp)
      - QWEN_LOCAL_URL=http://qwen-local:8080/v1
      - QWEN_LOCAL_MODEL=${QWEN_LOCAL_MODEL:-local-model}
    depends_on:
      qwen-local:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - saas-network
    restart: unless-stopped

  # Сервис с локальной моделью через llama.cpp
  qwen-local:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8001:8080"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/qwen2.5-0.5b-instruct-q8_0.gguf --host 0.0.0.0 --port 8080 -c 8192 --threads 4 -b 512 --alias local-model
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - saas-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  postgres_data:

networks:
  saas-network:
    driver: bridge
