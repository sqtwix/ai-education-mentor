server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Базовая защита браузерного контура. Все ресурсы интерфейса загружаются
    # из текущего origin; inline style нужен для существующих React-компонентов.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vite добавляет hash к именам production-ресурсов: их можно безопасно
    # кешировать надолго. Несуществующий chunk не должен возвращать SPA HTML.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    # Serve frontend static assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # HTML и маршруты SPA всегда перепроверяются после публикации новой версии.
        expires -1;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy API requests to backend api-core service
    location /api/ {
        proxy_pass http://api-core:5000;
        proxy_http_version 1.1;
        # Тот же суммарный предел, что и в API Core: запрос отклоняется до записи
        # потенциально опасного тела на диск приложения.
        client_max_body_size 50m;
        proxy_request_buffering off;
        # Крупный JSON бенчмарков передаётся клиенту потоком и не записывается
        # во временный файл nginx при нехватке стандартных proxy buffers.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # location с собственным add_header не наследует server-level заголовки.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
